<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kerala Open World</title>

<style>
html,body{                                                                                                
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#87ceeb;
}

#hud{
    position:fixed;
    top:18px;
    left:18px;
    z-index:10;
    background:rgba(15,35,40,.9);
    color:white;
    padding:18px;
    border-radius:14px;
    min-width:235px;
    line-height:1.65;
    box-shadow:0 6px 25px rgba(0,0,0,.3);
}

#hud h2{
    margin:0 0 7px;
    font-size:21px;
}

#traffic{
    color:#ffd85c;
#fuel{
    color:#7ee787;
}

#message{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    background:rgba(0,0,0,.85);
    color:white;
    padding:12px 22px;
    border-radius:12px;
}
</style>
</head>

<body>

<div id="hud">
    <h2>🌴 Kerala Open World</h2>
    <div id="mode">Mode: Walking</div>
    <div>W A S D = Move / Drive</div>
    <div>E = Enter / Exit Car</div>
    <div>Shift = Run</div>
    <div id="traffic">Traffic: 0</div>
</div>

<div id="message">
    Walk to the red car and press E 🚗
</div>

<script type="module">

===================================================== */

   HOUSES
===================================================== */

function createHouse(x,z){

    const house=
        new THREE.Group();

    const body=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                8,5,7
            ),
            new THREE.MeshStandardMaterial({
                color:0xd8d2b9
            })
        );

    body.position.y=2.5;

    house.add(body);

    const roof=
        new THREE.Mesh(
            new THREE.ConeGeometry(
                5.8,3.5,4
            ),
            new THREE.MeshStandardMaterial({
                color:0x934d3d
            })
        );

    roof.position.y=6.7;
    roof.rotation.y=Math.PI/4;

    house.add(roof);

    house.position.set(
        x,0,z
    );

    scene.add(house);
}

    createHouse(27,z+20);
}


/* =====================================================
   COCONUT PALMS
===================================================== */

function createPalm(x,z){

    const palm=
        new THREE.Group();

    const trunk=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .45,.7,8,8
            ),
            new THREE.MeshStandardMaterial({
                color:0x70442b
            })
        );

    trunk.position.y=4;

    palm.add(trunk);

    for(let i=0;i<8;i++){

        const leaf=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .35,.25,5
                ),
                new THREE.MeshStandardMaterial({
                    color:0x146b35
                })
            );

        leaf.position.y=8;
        leaf.rotation.y=i*Math.PI/4;
        leaf.rotation.x=-.25;

        palm.add(leaf);
    }

    palm.position.set(x,0,z);

    scene.add(palm);
}

/* =====================================================
   AUTO RICKSHAW
===================================================== */

function createAuto(
    color,
    x,
    z,
    direction
){

    const auto=
        new THREE.Group();

    const body=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.5,1.8,3.4
            ),
            new THREE.MeshStandardMaterial({
                color:color
            })
        );

    body.position.y=1.3;

    auto.add(body);

    const roof=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.4,.35,2.9
            ),
            new THREE.MeshStandardMaterial({
                color:0x171717
            })
        );

    roof.position.y=2.5;

    auto.add(roof);

    const glass=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2,.7,.1
            ),
            new THREE.MeshStandardMaterial({
                color:0x263238,
                transparent:true,
                opacity:.8
            })
        );

    glass.position.set(
        0,1.8,-1.72
    );

    auto.add(glass);

    const wheel=
        new THREE.CylinderGeometry(
            .48,.48,.35,12
        );

    [
        [-1.25,-.9],
        [1.25,-.9],
        [0,1.25]
    ].forEach(([wx,wz])=>{

        const w=
            new THREE.Mesh(
                wheel,
                new THREE.MeshStandardMaterial({
                    color:0x111111
                })
            );

        w.rotation.z=Math.PI/2;

        w.position.set(
            wx,.55,wz
        );

        auto.add(w);
    });

    auto.position.set(
        x,0,z
    );

    auto.rotation.y=
        direction>0
        ?Math.PI
        :0;

    scene.add(auto);

    return{
        mesh:auto,
        speed:.18,
        direction
    };
}


/* =====================================================
   TRAFFIC CAR
===================================================== */

function createTrafficCar(
    color,x,z,direction
){

    const trafficCar=
        new THREE.Group();

    addCarParts(
        trafficCar,
        color
    );

    trafficCar.position.set(
        x,0,z
    );

    trafficCar.rotation.y=
        direction>0
        ?Math.PI
        :0;

    scene.add(
        trafficCar
    );

    return{
        mesh:trafficCar,
        speed:.22+
            Math.random()*.08,
        direction
    };
}


/* =====================================================
   KERALA BUS
===================================================== */

function createBus(
    x,z,direction
){

    const bus=
        new THREE.Group();

    /* Main body */

    const body=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                4.8,
                3.8,
                12
            ),
            new THREE.MeshStandardMaterial({
                color:0xe7d7a7
            })
        );

    body.position.y=2.5;

    bus.add(body);


    /* Red lower stripe */

    const stripe=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                4.9,
                .65,
                12.05
            ),
            new THREE.MeshStandardMaterial({
                color:0xb51f25
            })
        );

    stripe.position.y=1.35;

    bus.add(stripe);


    /* Black window band */

    const windowBand=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                4.85,
                1.35,
                10.3
            ),
            new THREE.MeshStandardMaterial({
                color:0x17252a
            })
        );

    windowBand.position.y=3.65;

    bus.add(windowBand);


    /* Individual windows */

    for(let i=-4;i<=4;i+=2){

        const window=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    3.9,
                    .85,
                    1.35
                ),
                new THREE.MeshStandardMaterial({
                    color:0x78909c,
                    metalness:.1,
                    roughness:.25
                })
            );

        window.position.set(
            0,
            3.65,
            i
        );

        bus.add(window);
    }


    /* Roof */

    const roof=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                4.7,.3,11.8
            ),
            new THREE.MeshStandardMaterial({
                color:0xf2e6bd
            })
        );

    roof.position.y=4.55;

    bus.add(roof);


    /* Front windshield */

    const windshield=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3.9,
                1.3,
                .15
            ),
            new THREE.MeshStandardMaterial({
                color:0x263238
            })
        );

    windshield.position.set(
        0,
        3.3,
        -6.05
    );

    bus.add(windshield);


    /* Front bumper */

    const bumper=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                4.7,.35,.3
            ),
            new THREE.MeshStandardMaterial({
                color:0xeeeeee
            })
        );

    bumper.position.set(
        0,.65,-6.15
    );

    bus.add(bumper);


    /* Headlights */

    const headlightMaterial=
        new THREE.MeshStandardMaterial({
            color:0xffffcc,
            emissive:0xffff99,
            emissiveIntensity:.5
        });

    [-1.45,1.45].forEach(x=>{

        const light=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .65,.45,.15
                ),
                headlightMaterial
            );

        light.position.set(
            x,1.05,-6.18
        );

        bus.add(light);
    });


    /* Wheels */

    const wheelGeometry=
        new THREE.CylinderGeometry(
            .85,.85,.6,20
        );

    [
        [-2.45,-4],
        [2.45,-4],
        [-2.45,4],
        [2.45,4]
    ].forEach(([wx,wz])=>{

        const wheel=
            new THREE.Mesh(
                wheelGeometry,
                new THREE.MeshStandardMaterial({
                    color:0x111111
                })
            );

        wheel.rotation.z=Math.PI/2;

        wheel.position.set(
            wx,.85,wz
        );

        bus.add(wheel);
    });


    /* Bus destination sign */

    const sign=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.8,.45,.12
            ),
            new THREE.MeshStandardMaterial({
                color:0x202020,
                emissive:0x332200
            })
        );

    sign.position.set(
        0,4.25,-6.2
    );

    bus.add(sign);


    /* Bus position */

    bus.position.set(
        x,0,z
    );

    bus.rotation.y=
        direction>0
        ?Math.PI
        :0;

    scene.add(bus);

    return{
        mesh:bus,
        speed:.16,
        direction
    };
}

/* =====================================================
   PLAYER VEHICLE STATE
===================================================== */

let driving=false;

let carSpeed = 0;

const maxSpeed=.65;

const acceleration=.018;

const braking=.035;

const friction=.012;


/* =====================================================
   ENTER / EXIT
===================================================== */

function toggleVehicle(){

    if(!driving){

        const distance=
            player.position.distanceTo(
                car.position
            );

        if(distance<5){

            driving=true;

            player.visible=false;

            document.getElementById(
                "mode"
            ).innerText=
                "Mode: 🚗 Driving";

            document.getElementById(
                "message"
            ).innerText=
                "W Accelerate • S Brake • A/D Steer";
        }

    }else{

        driving=false;

        player.visible=true;

        player.position.copy(
            car.position
        );

        player.position.x+=4;

        carSpeed=0;

        document.getElementById(
            "mode"
        ).innerText=
            "Mode: Walking";

        document.getElementById(
            "message"
        ).innerText=
            "You're out of the car 🚶";
    }
}


/* =====================================================
   WALKING
===================================================== */

function updatePlayer(){

    if(driving)return;

    const speed=
        keys["shift"]
        ?.28
        :.14;

    if(keys["w"])
        player.position.z-=speed;

    if(keys["s"])
        player.position.z+=speed;

    if(keys["a"])
        player.position.x-=speed;

    if(keys["d"])
        player.position.x+=speed;

   player.position.x=
    THREE.MathUtils.clamp(
        player.position.x,
        -60,60
    );


player.position.z=
    THREE.MathUtils.clamp(
        player.position.z,
        -1000,1000
    );

}


/* =====================================================
   PLAYER CAR DRIVING
===================================================== */

function updateCar(){

    if(!driving)return;

    if(keys["w"]){

        carSpeed+=acceleration;

        carSpeed=
            Math.min(
                carSpeed,
                maxSpeed
            );
    }

    if(keys["s"]){

        if(carSpeed>0){

            carSpeed=
                Math.max(
                    0,
                    carSpeed-braking
                );

        }else{

            carSpeed-=acceleration;

            carSpeed=
                Math.max(
                    carSpeed,-.3
                );
        }
    }

    if(
        !keys["w"] &&
        !keys["s"]
    ){

        if(carSpeed>0)
            carSpeed=
                Math.max(
                    0,
                    carSpeed-friction
                );

        if(carSpeed<0)
            carSpeed=
                Math.min(
                    0,
                    carSpeed+friction
                );
    }

    if(Math.abs(carSpeed)>.01){

        const steering=
            .035*
            (carSpeed/maxSpeed);

        if(keys["a"])
            car.rotation.y+=steering;

        if(keys["d"])
            car.rotation.y-=steering;
    }

    const direction=
        new THREE.Vector3(
            0,0,-1
        );

    direction.applyQuaternion(
        car.quaternion
    );

    car.position.addScaledVector(
        direction,
        carSpeed
  );
    /* WHEEL ROTATION */

car.children.forEach(part => {

    if(
        part.geometry &&
        part.geometry.type === "CylinderGeometry"
    ){

        /* Wheel spinning */
        part.rotation.x -=
            carSpeed * 2.5;


        /* Front wheel steering */
        if(part.position.z < -1){

            if(keys["a"])
                part.rotation.y = .35;

            else if(keys["d"])
                part.rotation.y = -.35;

            else
                part.rotation.y = 0;

        }

    }

});
    car.position.x=
        THREE.MathUtils.clamp(
            car.position.x,
            -60,60
        );

    car.position.z=
        THREE.MathUtils.clamp(
            car.position.z,
            -1000,1000
        );



/* BRAKE LIGHTS */

car.children.forEach(part => {

    if(part.name==="brakeLight"){

        if(keys["s"])
            part.material.emissiveIntensity=2.5;
        else
            part.material.emissiveIntensity=.4;

    }

});

    /* TURN INDICATORS */

car.children.forEach(part => {

    if(part.name==="rearIndicator"){

        const blinking =
            Math.floor(performance.now()/400)%2===0;

        if(part.position.x < 0){

            part.visible =
                keys["a"] && blinking;

        }else{

            part.visible =
                keys["d"] && blinking;

        }

    }

});

}
    
/* =====================================================
   TRAFFIC MOVEMENT
===================================================== */

function updateTraffic(){

    traffic.forEach(vehicle => {

        vehicle.mesh.position.z +=
            vehicle.direction * vehicle.speed;

        /*
         * Keep traffic on the road.
         * Vehicles use the left/right lanes
         * and cross the bridge instead of
         * driving through the water.
         */

        if(vehicle.mesh.position.z > 950){

            vehicle.mesh.position.z = -950;

        }

        if(vehicle.mesh.position.z < -950){

            vehicle.mesh.position.z = 950;

        }
    });


    /* =================================================
       PEDESTRIANS
    ================================================= */

    pedestrians.forEach(npc => {

        npc.mesh.position.x +=
            npc.direction * npc.speed;

        if(npc.mesh.position.x > 12){

            npc.direction = -1;

        }

        if(npc.mesh.position.x < -12){

            npc.direction = 1;

        }

        npc.mesh.rotation.y =
            npc.direction > 0
            ? Math.PI / 2
            : -Math.PI / 2;
    });
}

/* =====================================================
   CAMERA
===================================================== */

const cameraTarget=
    new THREE.Vector3();

function updateCamera(){

    const target=
        driving
        ?car
        :player;

    const offset=
        new THREE.Vector3(
            0,7,11
        );

    offset.applyQuaternion(
        target.quaternion
    );

    const desired=
        target.position
            .clone()
            .add(offset);

    camera.position.lerp(
        desired,.08
    );

    cameraTarget.copy(
        target.position
    );

    cameraTarget.y+=1.5;

    camera.lookAt(
        cameraTarget
    );
}


/* =====================================================
   GAME LOOP
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );

    updatePlayer();

    updateCar();

    updateTraffic();

    updateBoats();

    updateCamera();

    renderer.render(
        scene,
        camera
    );
}

animate();


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);
