<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kerala Open World</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #87ceeb;
    }

    #hud {
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 10;
        background: rgba(20, 35, 40, 0.88);
        color: white;
        padding: 18px;
        border-radius: 14px;
        line-height: 1.6;
        min-width: 220px;
        box-shadow: 0 5px 20px rgba(0,0,0,.25);
    }

    #hud h2 {
        margin: 0 0 8px;
        font-size: 20px;
    }

    #message {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,.85);
        color: white;
        padding: 12px 22px;
        border-radius: 12px;
        z-index: 10;
        font-size: 16px;
    }
</style>
</head>

<body>

<div id="hud">
    <h2>🌴 Kerala Open World</h2>
    <div id="mode">Mode: Walking</div>
    <div>W A S D = Move / Drive</div>
    <div>E = Enter / Exit Car</div>
    <div>Shift = Run</div>
</div>

<div id="message">Walk to the red car and press E 🚗</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* ---------------- SCENE ---------------- */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

scene.fog = new THREE.Fog(
    0x87ceeb,
    80,
    400
);

/* ---------------- CAMERA ---------------- */

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 8, 12);

/* ---------------- RENDERER ---------------- */

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

document.body.appendChild(renderer.domElement);

/* ---------------- LIGHTS ---------------- */

const sun = new THREE.DirectionalLight(
    0xffffff,
    2
);

sun.position.set(
    50,
    100,
    50
);

scene.add(sun);

const ambient = new THREE.HemisphereLight(
    0xffffff,
    0x668866,
    1.4
);

scene.add(ambient);

/* ---------------- GROUND ---------------- */

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(600, 600),
    new THREE.MeshStandardMaterial({
        color: 0x5fa35f
    })
);

ground.rotation.x = -Math.PI / 2;

scene.add(ground);

/* ---------------- ROAD ---------------- */

const road = new THREE.Mesh(
    new THREE.PlaneGeometry(28, 600),
    new THREE.MeshStandardMaterial({
        color: 0x3e454b
    })
);

road.rotation.x = -Math.PI / 2;
road.position.y = 0.02;

scene.add(road);

/* ---------------- ROAD LINES ---------------- */

for (let z = -290; z < 300; z += 12) {

    const line = new THREE.Mesh(
        new THREE.BoxGeometry(0.35, 0.04, 6),
        new THREE.MeshStandardMaterial({
            color: 0xffdf65
        })
    );

    line.position.set(0, 0.05, z);

    scene.add(line);
}

/* ---------------- HOUSES ---------------- */

function createHouse(x, z) {

    const house = new THREE.Group();

    const body = new THREE.Mesh(
        new THREE.BoxGeometry(8, 5, 7),
        new THREE.MeshStandardMaterial({
            color: 0xd8d3bd
        })
    );

    body.position.y = 2.5;

    house.add(body);

    const roof = new THREE.Mesh(
        new THREE.ConeGeometry(5.8, 3.5, 4),
        new THREE.MeshStandardMaterial({
            color: 0x934c3c
        })
    );

    roof.position.y = 6.7;

    roof.rotation.y = Math.PI / 4;

    house.add(roof);

    house.position.set(x, 0, z);

    scene.add(house);
}

for (let z = -80; z < 100; z += 35) {

    createHouse(-25, z);
    createHouse(25, z + 15);
}

/* ---------------- COCONUT TREES ---------------- */

function createPalm(x, z) {

    const palm = new THREE.Group();

    const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(
            0.45,
            0.7,
            8,
            8
        ),
        new THREE.MeshStandardMaterial({
            color: 0x75472b
        })
    );

    trunk.position.y = 4;

    palm.add(trunk);

    const leaves = new THREE.Group();

    for (let i = 0; i < 8; i++) {

        const leaf = new THREE.Mesh(
            new THREE.BoxGeometry(0.35, 0.25, 5),
            new THREE.MeshStandardMaterial({
                color: 0x146b35
            })
        );

        const angle =
            (Math.PI * 2 / 8) * i;

        leaf.position.y = 8;

        leaf.rotation.y = angle;

        leaf.rotation.x = -0.25;

        leaves.add(leaf);
    }

    palm.add(leaves);

    palm.position.set(x, 0, z);

    scene.add(palm);
}

for (let z = -270; z < 280; z += 35) {

    createPalm(-42, z);
    createPalm(42, z + 15);
}

/* ---------------- PLAYER ---------------- */

const player = new THREE.Group();

const playerBody = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.65, 1.8, 6, 12),
    new THREE.MeshStandardMaterial({
        color: 0x164f38
    })
);

playerBody.position.y = 1.3;

player.add(playerBody);

player.position.set(
    0,
    0,
    12
);

scene.add(player);

/* ---------------- CAR ---------------- */

const car = new THREE.Group();

const carBody = new THREE.Mesh(
    new THREE.BoxGeometry(4.2, 1.2, 7),
    new THREE.MeshStandardMaterial({
        color: 0xc62828
    })
);

carBody.position.y = 1.1;

car.add(carBody);

/* Car roof */

const carRoof = new THREE.Mesh(
    new THREE.BoxGeometry(3.4, 1.1, 3.5),
    new THREE.MeshStandardMaterial({
        color: 0x8e1c1c
    })
);

carRoof.position.y = 2;

carRoof.position.z = -0.2;

car.add(carRoof);

/* Wheels */

const wheelGeometry =
    new THREE.CylinderGeometry(
        0.75,
        0.75,
        0.55,
        16
    );

function addWheel(x, z) {

    const wheel = new THREE.Mesh(
        wheelGeometry,
        new THREE.MeshStandardMaterial({
            color: 0x111111
        })
    );

    wheel.rotation.z = Math.PI / 2;

    wheel.position.set(
        x,
        0.75,
        z
    );

    car.add(wheel);
}

addWheel(-2.1, -2.2);
addWheel(2.1, -2.2);
addWheel(-2.1, 2.2);
addWheel(2.1, 2.2);

car.position.set(
    6,
    0,
    8
);

scene.add(car);

/* ---------------- CONTROLS ---------------- */

const keys = {};

window.addEventListener(
    "keydown",
    e => {

        keys[e.key.toLowerCase()] = true;

        if (e.key.toLowerCase() === "e") {
            toggleVehicle();
        }

    }
);

window.addEventListener(
    "keyup",
    e => {
        keys[e.key.toLowerCase()] = false;
    }
);

/* ---------------- GAME STATE ---------------- */

let driving = false;

let carSpeed = 0;

const maxSpeed = 0.65;

const acceleration = 0.018;

const braking = 0.035;

const friction = 0.012;

/* ---------------- ENTER / EXIT ---------------- */

function toggleVehicle() {

    if (!driving) {

        const distance =
            player.position.distanceTo(
                car.position
            );

        if (distance < 5) {

            driving = true;

            player.visible = false;

            document.getElementById("mode")
                .innerText =
                "Mode: 🚗 Driving";

            document.getElementById("message")
                .innerText =
                "W = Accelerate | S = Brake | A/D = Steer";

        }

    } else {

        driving = false;

        player.visible = true;

        player.position.copy(
            car.position
        );

        player.position.x += 4;

        carSpeed = 0;

        document.getElementById("mode")
            .innerText =
            "Mode: Walking";

        document.getElementById("message")
            .innerText =
            "You're out of the car 🚶";

    }
}

/* ---------------- WALKING ---------------- */

function updatePlayer() {

    if (driving) return;

    let speed =
        keys["shift"]
        ? 0.28
        : 0.14;

    if (keys["w"])
        player.position.z -= speed;

    if (keys["s"])
        player.position.z += speed;

    if (keys["a"])
        player.position.x -= speed;

    if (keys["d"])
        player.position.x += speed;

    /* Keep player near world */

    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -13,
            13
        );
}

/* ---------------- DRIVING ---------------- */

function updateCar() {

    if (!driving) return;

    /* Acceleration */

    if (keys["w"]) {

        carSpeed += acceleration;

        carSpeed =
            Math.min(
                carSpeed,
                maxSpeed
            );
    }

    /* Reverse */

    if (keys["s"]) {

        carSpeed -= acceleration;

        carSpeed =
            Math.max(
                carSpeed,
                -maxSpeed * 0.45
            );
    }

    /* Natural slowdown */

    if (
        !keys["w"] &&
        !keys["s"]
    ) {

        if (carSpeed > 0)
            carSpeed =
                Math.max(
                    0,
                    carSpeed - friction
                );

        if (carSpeed < 0)
            carSpeed =
                Math.min(
                    0,
                    carSpeed + friction
                );
    }

    /* Braking */

    if (keys["s"] && carSpeed > 0) {

        carSpeed =
            Math.max(
                0,
                carSpeed - braking
            );
    }

    /* Steering */

    if (Math.abs(carSpeed) > 0.01) {

        let steering =
            0.035 *
            (carSpeed / maxSpeed);

        if (keys["a"])
            car.rotation.y += steering;

        if (keys["d"])
            car.rotation.y -= steering;
    }

    /* Move car forward */

    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    direction.applyQuaternion(
        car.quaternion
    );

    car.position.addScaledVector(
        direction,
        carSpeed
    );

    /* World boundaries */

    car.position.x =
        THREE.MathUtils.clamp(
            car.position.x,
            -13,
            13
        );

    car.position.z =
        THREE.MathUtils.clamp(
            car.position.z,
            -285,
            285
        );
}

/* ---------------- CAMERA ---------------- */

const cameraTarget =
    new THREE.Vector3();

function updateCamera() {

    const target =
        driving
        ? car
        : player;

    const offset =
        new THREE.Vector3(
            0,
            7,
            11
        );

    offset.applyQuaternion(
        target.quaternion
    );

    const desired =
        target.position.clone()
            .add(offset);

    camera.position.lerp(
        desired,
        0.08
    );

    cameraTarget.copy(
        target.position
    );

    cameraTarget.y += 1.5;

    camera.lookAt(
        cameraTarget
    );
}

/* ---------------- ANIMATION ---------------- */

function animate() {

    requestAnimationFrame(
        animate
    );

    updatePlayer();

    updateCar();

    updateCamera();

    renderer.render(
        scene,
        camera
    );
}

animate();

/* ---------------- RESIZE ---------------- */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
