<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kerala Open World</title>

<style>
html,body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#87ceeb;
}

#hud{
    position:fixed;
    top:18px;
    left:18px;
    z-index:10;
    background:rgba(15,35,40,.9);
    color:white;
    padding:18px;
    border-radius:14px;
    min-width:230px;
    line-height:1.65;
    box-shadow:0 6px 25px rgba(0,0,0,.3);
}

#hud h2{
    margin:0 0 7px;
    font-size:21px;
}

#message{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    background:rgba(0,0,0,.85);
    color:white;
    padding:12px 22px;
    border-radius:12px;
}

#traffic{
    color:#ffd85c;
}
</style>
</head>

<body>

<div id="hud">
    <h2>🌴 Kerala Open World</h2>
    <div id="mode">Mode: Walking</div>
    <div>W A S D = Move / Drive</div>
    <div>E = Enter / Exit Car</div>
    <div>Shift = Run</div>
    <div id="traffic">Traffic: 0</div>
</div>

<div id="message">
    Walk to the red car and press E 🚗
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =====================================================
   SCENE
===================================================== */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x87ceeb);

scene.fog =
    new THREE.Fog(
        0x87ceeb,
        90,
        420
    );


/* =====================================================
   CAMERA
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        60,
        innerWidth / innerHeight,
        .1,
        1000
    );

camera.position.set(
    0,
    7,
    12
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   LIGHTING
===================================================== */

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.position.set(
    80,
    120,
    50
);

scene.add(sun);

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x557755,
        1.4
    )
);


/* =====================================================
   GROUND
===================================================== */

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            700,
            700
        ),
        new THREE.MeshStandardMaterial({
            color:0x5da35d
        })
    );

ground.rotation.x =
    -Math.PI / 2;

scene.add(ground);


/* =====================================================
   MAIN ROAD
===================================================== */

const road =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            30,
            650
        ),
        new THREE.MeshStandardMaterial({
            color:0x3e454b
        })
    );

road.rotation.x =
    -Math.PI / 2;

road.position.y=.02;

scene.add(road);


/* =====================================================
   ROAD MARKINGS
===================================================== */

for(let z=-320;z<330;z+=12){

    const line =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .35,
                .04,
                6
            ),
            new THREE.MeshStandardMaterial({
                color:0xffdf63
            })
        );

    line.position.set(
        0,
        .05,
        z
    );

    scene.add(line);
}


/* =====================================================
   HOUSES
===================================================== */

function createHouse(x,z){

    const group =
        new THREE.Group();

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                8,
                5,
                7
            ),
            new THREE.MeshStandardMaterial({
                color:0xd8d2b9
            })
        );

    body.position.y=2.5;

    group.add(body);

    const roof =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                5.8,
                3.5,
                4
            ),
            new THREE.MeshStandardMaterial({
                color:0x934d3d
            })
        );

    roof.position.y=6.7;
    roof.rotation.y=Math.PI/4;

    group.add(roof);

    group.position.set(
        x,
        0,
        z
    );

    scene.add(group);
}

for(let z=-280;z<300;z+=40){

    createHouse(-27,z);
    createHouse(27,z+20);
}


/* =====================================================
   COCONUT TREES
===================================================== */

function createPalm(x,z){

    const palm =
        new THREE.Group();

    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .45,
                .7,
                8,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0x70442b
            })
        );

    trunk.position.y=4;

    palm.add(trunk);

    for(let i=0;i<8;i++){

        const leaf =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .35,
                    .25,
                    5
                ),
                new THREE.MeshStandardMaterial({
                    color:0x146b35
                })
            );

        leaf.position.y=8;
        leaf.rotation.y=
            i*Math.PI/4;
        leaf.rotation.x=-.25;

        palm.add(leaf);
    }

    palm.position.set(
        x,
        0,
        z
    );

    scene.add(palm);
}

for(let z=-310;z<330;z+=32){

    createPalm(-43,z);
    createPalm(43,z+14);
}


/* =====================================================
   PLAYER
===================================================== */

const player =
    new THREE.Group();

const playerBody =
    new THREE.Mesh(
        new THREE.CapsuleGeometry(
            .65,
            1.8,
            6,
            12
        ),
        new THREE.MeshStandardMaterial({
            color:0x164f38
        })
    );

playerBody.position.y=1.3;

player.add(playerBody);

player.position.set(
    0,
    0,
    12
);

scene.add(player);


/* =====================================================
   PLAYER CAR
===================================================== */

const car =
    new THREE.Group();

function addCarParts(
    group,
    bodyColor
){

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                4.2,
                1.2,
                7
            ),
            new THREE.MeshStandardMaterial({
                color:bodyColor
            })
        );

    body.position.y=1.1;

    group.add(body);

    const roof =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3.4,
                1.1,
                3.5
            ),
            new THREE.MeshStandardMaterial({
                color:
                    new THREE.Color(bodyColor)
                        .multiplyScalar(.72)
            })
        );

    roof.position.set(
        0,
        2,
        -.2
    );

    group.add(roof);

    const wheelGeometry =
        new THREE.CylinderGeometry(
            .75,
            .75,
            .55,
            16
        );

    [
        [-2.1,-2.2],
        [2.1,-2.2],
        [-2.1,2.2],
        [2.1,2.2]
    ].forEach(([x,z])=>{

        const wheel =
            new THREE.Mesh(
                wheelGeometry,
                new THREE.MeshStandardMaterial({
                    color:0x111111
                })
            );

        wheel.rotation.z=
            Math.PI/2;

        wheel.position.set(
            x,
            .75,
            z
        );

        group.add(wheel);
    });
}

addCarParts(
    car,
    0xc62828
);

car.position.set(
    6,
    0,
    8
);

scene.add(car);


/* =====================================================
   AUTO RICKSHAW
===================================================== */

function createAuto(
    color,
    x,
    z,
    direction
){

    const auto =
        new THREE.Group();

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.5,
                1.8,
                3.4
            ),
            new THREE.MeshStandardMaterial({
                color:color
            })
        );

    body.position.y=1.3;

    auto.add(body);

    const roof =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.4,
                .35,
                2.9
            ),
            new THREE.MeshStandardMaterial({
                color:0x171717
            })
        );

    roof.position.y=2.5;

    auto.add(roof);

    const windshield =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2,
                .7,
                .1
            ),
            new THREE.MeshStandardMaterial({
                color:0x263238,
                transparent:true,
                opacity:.8
            })
        );

    windshield.position.set(
        0,
        1.8,
        -1.72
    );

    auto.add(windshield);

    const wheelGeometry =
        new THREE.CylinderGeometry(
            .48,
            .48,
            .35,
            12
        );

    [
        [-1.25,-.9],
        [1.25,-.9],
        [0,1.25]
    ].forEach(([wx,wz])=>{

        const wheel =
            new THREE.Mesh(
                wheelGeometry,
                new THREE.MeshStandardMaterial({
                    color:0x111111
                })
            );

        wheel.rotation.z=
            Math.PI/2;

        wheel.position.set(
            wx,
            .55,
            wz
        );

        auto.add(wheel);
    });

    auto.position.set(
        x,
        0,
        z
    );

    auto.rotation.y =
        direction > 0
        ? Math.PI
        : 0;

    scene.add(auto);

    return {
        mesh:auto,
        speed:.18,
        direction
    };
}


/* =====================================================
   TRAFFIC CAR
===================================================== */

function createTrafficCar(
    color,
    x,
    z,
    direction
){

    const trafficCar =
        new THREE.Group();

    addCarParts(
        trafficCar,
        color
    );

    trafficCar.position.set(
        x,
        0,
        z
    );

    trafficCar.rotation.y =
        direction > 0
        ? Math.PI
        : 0;

    scene.add(
        trafficCar
    );

    return {
        mesh:trafficCar,
        speed:.22 +
            Math.random()*.08,
        direction
    };
}


/* =====================================================
   CREATE TRAFFIC
===================================================== */

const traffic=[];


/* Cars travelling north */

traffic.push(
    createTrafficCar(
        0x1565c0,
        -7,
        -100,
        -1
    )
);

traffic.push(
    createTrafficCar(
        0xf9a825,
        -7,
        -210,
        -1
    )
);

traffic.push(
    createTrafficCar(
        0xeeeeee,
        -7,
        130,
        -1
    )
);


/* Cars travelling south */

traffic.push(
    createTrafficCar(
        0x2e7d32,
        7,
        80,
        1
    )
);

traffic.push(
    createTrafficCar(
        0x6a1b9a,
        7,
        200,
        1
    )
);


/* Auto-rickshaws */

traffic.push(
    createAuto(
        0xffc107,
        -7,
        -30,
        -1
    )
);

traffic.push(
    createAuto(
        0xffc107,
        7,
        150,
        1
    )
);

traffic.push(
    createAuto(
        0x00897b,
        -7,
        230,
        -1
    )
);

document.getElementById(
    "traffic"
).innerText =
    "Traffic: " +
    traffic.length;


/* =====================================================
   KEYBOARD
===================================================== */

const keys={};

window.addEventListener(
    "keydown",
    e=>{

        keys[
            e.key.toLowerCase()
        ]=true;

        if(
            e.key.toLowerCase()==="e"
        ){
            toggleVehicle();
        }
    }
);

window.addEventListener(
    "keyup",
    e=>{

        keys[
            e.key.toLowerCase()
        ]=false;
    }
);


/* =====================================================
   VEHICLE STATE
===================================================== */

let driving=false;

let carSpeed=0;

const maxSpeed=.65;

const acceleration=.018;

const braking=.035;

const friction=.012;


/* =====================================================
   ENTER / EXIT
===================================================== */

function toggleVehicle(){

    if(!driving){

        const distance =
            player.position.distanceTo(
                car.position
            );

        if(distance<5){

            driving=true;

            player.visible=false;

            document.getElementById(
                "mode"
            ).innerText=
                "Mode: 🚗 Driving";

            document.getElementById(
                "message"
            ).innerText=
                "W Accelerate • S Brake • A/D Steer";
        }

    }else{

        driving=false;

        player.visible=true;

        player.position.copy(
            car.position
        );

        player.position.x+=4;

        carSpeed=0;

        document.getElementById(
            "mode"
        ).innerText=
            "Mode: Walking";

        document.getElementById(
            "message"
        ).innerText=
            "You're out of the car 🚶";
    }
}


/* =====================================================
   PLAYER MOVEMENT
===================================================== */

function updatePlayer(){

    if(driving)return;

    const speed =
        keys["shift"]
        ? .28
        : .14;

    if(keys["w"])
        player.position.z-=speed;

    if(keys["s"])
        player.position.z+=speed;

    if(keys["a"])
        player.position.x-=speed;

    if(keys["d"])
        player.position.x+=speed;

    player.position.x=
        THREE.MathUtils.clamp(
            player.position.x,
            -13,
            13
        );
}


/* =====================================================
   PLAYER CAR DRIVING
===================================================== */

function updateCar(){

    if(!driving)return;

    if(keys["w"]){

        carSpeed+=acceleration;

        carSpeed=
            Math.min(
                carSpeed,
                maxSpeed
            );
    }

    if(keys["s"]){

        if(carSpeed>0){

            carSpeed=
                Math.max(
                    0,
                    carSpeed-braking
                );

        }else{

            carSpeed-=acceleration;

            carSpeed=
                Math.max(
                    carSpeed,
                    -.3
                );
        }
    }

    if(
        !keys["w"] &&
        !keys["s"]
    ){

        if(carSpeed>0)
            carSpeed=
                Math.max(
                    0,
                    carSpeed-friction
                );

        if(carSpeed<0)
            carSpeed=
                Math.min(
                    0,
                    carSpeed+friction
                );
    }

    if(Math.abs(carSpeed)>.01){

        const steering=
            .035*
            (carSpeed/maxSpeed);

        if(keys["a"])
            car.rotation.y+=steering;

        if(keys["d"])
            car.rotation.y-=steering;
    }

    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    direction.applyQuaternion(
        car.quaternion
    );

    car.position.addScaledVector(
        direction,
        carSpeed
    );

    car.position.x=
        THREE.MathUtils.clamp(
            car.position.x,
            -13,
            13
        );

    car.position.z=
        THREE.MathUtils.clamp(
            car.position.z,
            -320,
            320
        );
}


/* =====================================================
   TRAFFIC MOVEMENT
===================================================== */

function updateTraffic(){

    traffic.forEach(vehicle=>{

        vehicle.mesh.position.z +=
            vehicle.direction *
            vehicle.speed;

        /*
          Loop traffic around the map.
        */

        if(
            vehicle.mesh.position.z>330
        ){

            vehicle.mesh.position.z=-330;

        }

        if(
            vehicle.mesh.position.z<-330
        ){

            vehicle.mesh.position.z=330;
        }
    });
}


/* =====================================================
   CAMERA
===================================================== */

const cameraTarget =
    new THREE.Vector3();

function updateCamera(){

    const target =
        driving
        ? car
        : player;

    const offset =
        new THREE.Vector3(
            0,
            7,
            11
        );

    offset.applyQuaternion(
        target.quaternion
    );

    const desired =
        target.position
            .clone()
            .add(offset);

    camera.position.lerp(
        desired,
        .08
    );

    cameraTarget.copy(
        target.position
    );

    cameraTarget.y+=1.5;

    camera.lookAt(
        cameraTarget
    );
}


/* =====================================================
   ANIMATION
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );

    updatePlayer();

    updateCar();

    updateTraffic();

    updateCamera();

    renderer.render(
        scene,
        camera
    );
}

animate();


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>

</body>
</html>
